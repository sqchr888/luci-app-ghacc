# ghacc-daemon 配置 —— 安装到 /etc/ghacc/ghacc.conf
# 改完执行：/etc/init.d/ghacc restart
#
# 本文件已针对 QWRT 25.12.2 / ipq95xx / aarch64_cortex-a53 做过取值调整，
# 括号里标了「QWRT」的是结合你机器情况给出的建议值。

# ================= 基础 =================

# 需要守护的域名（可自行增删）
# 注：gist.github.com 在部分线路上被 SNI 单独阻断，hosts 无解，
#     若你的网络长期打不开它，建议从列表里删掉，省得守护进程反复重试。
#     需要的话加回来即可：gist.github.com
DOMAINS="github.com api.github.com codeload.github.com raw.githubusercontent.com gist.githubusercontent.com objects.githubusercontent.com avatars.githubusercontent.com"

# 健康探测间隔（秒）。越小切换越快，但对路由器和 GitHub 的请求越频繁。
# 8 个域名 × 每轮 1 次探测，15 秒一轮的开销很低。
CHECK_INTERVAL=15

# 单个 IP 的探测超时（秒）。
PROBE_TIMEOUT=3

# 每个域名写入几个 IP（多写=备胎，但死 IP 会拖慢连接，建议 1~2）
MAX_IPS=2

# 上游候选池刷新间隔（秒）
POOL_REFRESH=600

# ============ 候选 IP 从哪来（v2.4.4 说明）============
#
# 守护进程的候选 IP 有四个来源，按优先级排列（顺序在 candidates() 里体现，
# 因为最终会按 MAX_CANDIDATES 截断，所以顺序即优先级）：
#
#   1. POOL_CACHE —— 抓自 https://raw.hellogithub.com/hosts
#      **这是唯一有持续维护的来源**：开源项目 GitHub520
#      （github.com/521xueweihan/GitHub520），用 DNS 查询 + 实测可用性
#      生成 hosts 文件，每次请求都是最新的。主要依赖它。
#   2. DOH_LIST  —— 阿里 / 腾讯公共 DNS 的 DoH 接口，实时解析。
#   3. FASTLY_POOL / GH_POOL —— **写死的静态快照，无人维护、不会自动更新。**
#      它们是 2026-10 从 GitHub520 抄来的一次性数据，只在前两个来源全部
#      失败时兜底。会随时间失效，不要当作可靠来源。
#      要更新只能改这里（或在 daemon 里改默认值）。
#
# 如果你有更好的上游（例如自建镜像），可以覆盖 POOL_URL 或这两个池子。

# 每域名最多探测多少个候选 IP（截断上限，限制单轮 fork 总数）
# 注意：新鲜来源优先占用名额，兜底池只补剩余位置。
MAX_CANDIDATES=24

# 日志位置。/var 在 OpenWrt 上就是内存盘（/var -> /tmp），写日志不消耗闪存，
# 重启即失。想持久保存改到外挂磁盘。
LOG_FILE=/var/log/ghacc.log

# 日志最大行数，超出后自动裁剪
MAX_LOG=200

# 状态目录（IP 记录、失败计数、锁）。放 /tmp = 内存盘，零闪存消耗。
STATE_DIR=/tmp/ghacc

# ================= 输出目标（v2.3 起的关键项）=================
#
# 重要实测结论：QWRT 这类固件的 dnsmasq **不读 /etc/hosts**。
# 验证方法：往 /etc/hosts 追加 `1.2.3.4 test999.xyz` → SIGHUP 和重启 dnsmasq
# 后 nslookup 都返回 NXDOMAIN。它读的是 `addn-hosts=` 指定的额外文件。
# 所以真正生效的必须是下面这个 ADDN_HOSTS，而不是 /etc/hosts。

# dnsmasq 实际读取的条目文件。放在 /tmp（内存盘），零闪存消耗。
ADDN_HOSTS=/tmp/ghacc/hosts.addn

# dnsmasq 的 conf-dir，用于放 drop-in 注册上一条。
# 你的机器实测为 /tmp/dnsmasq.d（见 /var/etc/dnsmasq.conf.cfg01411c 的 conf-dir 行）。
# 留空则不做自动注册（需要你自己在 dnsmasq 配置里加 addn-hosts）。
DNSMASQ_CONFDIR=/tmp/dnsmasq.d

# 是否同时写 /etc/hosts。
#   0 = 不写（推荐：你这台的 dnsmasq 不读它，写了纯属浪费闪存）
#   1 = 也写（若换到其他固件、或要让路由器本机解析走 hosts，改成 1）
WRITE_ETC_HOSTS=0

# ================= DNS 热加载 =================

# dnsmasq.pid 路径。留空 = 自动探测（/var/run/dnsmasq.pid 等常见路径）。
# dnsmasq-full 或 QSDK 多实例环境下若自动探测不到，在这里手动指定。
DNSMASQ_PID=""

# 自定义重载命令。留空 = 自动（killall -HUP → pid 文件 → init reload）。
# 例：DNS_RELOAD_CMD="/etc/init.d/dnsmasq reload"
DNS_RELOAD_CMD=""

# ================= 资源保护（一般不用改）=================

# 并发探测进程数。硬上限 16。cortex-a53 跑 8 个很轻松。
CONCURRENCY=8

# （MAX_CANDIDATES 的定义与说明见文件上方「候选 IP 从哪来」一节）

# 连续失败几次才认定该域名已死。2 = 抗单次瞬时丢包，不会一抖就重扫。
FAIL_THRESHOLD=2

# 同一域名切换后的冷却期（秒）。防止抖动风暴。
COOLDOWN=120

# 两次 hosts 写入的最小间隔（秒）。**保护 flash 的关键参数**。
# 你的 overlay 只剩 9.7M，虽然每次只写约 1KB，仍建议保守取值。
# 抖动期间多次切换会被合并成一次写入。
#   60  = 默认，最坏情况每天 1440 次写入（约 1.4MB/天，可接受）
#   10  = 切换最快，但抖动时写入频繁，仅限 overlay 空间充裕时
#   0   = 不做限制（不建议）
MIN_WRITE_INTERVAL=60

# 单轮循环耗时告警阈值（秒）。仅记录日志，不中断进程。
CYCLE_GUARD=300

# ============ v2.4.4 起：健康判据（重要）============
#
# 判据经历了三代演进，当前以 **TLS 证书**为准：
#
#   第一代（v2.3 及以前）：只看 "HTTP 状态码 != 000"
#     被冒牌服务器骗过 —— 有 IP 返回 200 但正文只有 4 字节 "OK"，
#     浏览器打开 github.com 只显示一个 OK。
#
#   第二代（v2.4）：状态码 2xx/3xx + 正文体积下限 + 正文含特征串
#     挡住了冒牌 IP，但**大面积误杀**：很多受管域名根本不是网页
#     （objects 根路径 404、avatars 302、api 返回 JSON），强求正文必然失败。
#
#   第三代（v2.4.4 至今）：以证书为准 —— curl 退出码为 0 且
#     ssl_verify_result 为 0（证书链可信 + 域名匹配）。
#     404/302/空正文都发生在 TLS 之后，不再影响判定。
#
# v2.4.5 补充：证书合法只证明"对面是 GitHub 的服务器"，不证明它提供的是
# **该子域应有的服务** —— GitHub 多个子域共用 *.github.com 通配证书。
# 实测 api.github.com 被解析到一个证书合法但不提供 API 服务的 IP
# （访问根路径 301 跳转 github.com），导致 gh CLI 等工具全部失败。
# 因此对能定义"正确响应"的域名追加服务特征校验（见下）。

# ---- 主站 github.com：正文校验 ----
# 主站是真正的网页，用体积 + 特征串再加一道保险，
# 防止"证书正常但返回错误页"的极端情况（如 400 Bad request 节点）。
STRICT_MAIN_SITE=1

# 正文体积下限（字节）。真 GitHub 首页约 29 万字节；
# 4 字节的 "OK"、1.4KB 的报错页都会被这条挡掉。
# 调小会更宽松（可能放进坏节点），调大可能误杀精简页面。
MIN_BODY_SIZE=5000

# 正文必须包含的特征串（不区分大小写）。
BODY_MARKER=github

# ---- api.github.com：服务特征校验（v2.4.5 新增）----
# 该域名的根路径必须返回 200 且正文是 JSON（以 { 或 [ 开头）。
# 这是唯一能识别"证书合法但服务不对"的手段。
STRICT_API=1

# ============ v2.4 新增：DNS 自愈校验（B2）============
#
# 为什么需要：旧版只检查 "addn 文件在 + drop-in 文件在"，但文件齐全
# 不等于 dnsmasq 真的加载了它。若固件改了 conf-dir 加载规则、drop-in
# 被覆盖、或 dnsmasq 重启后没再读该文件，解析其实已经失效，而日志里
# 一切正常 —— 本项目历史上反复踩过这个坑（"内容对 ≠ 解析生效"）。
# 现在会定期问本机 dnsmasq 一个探针域名，确认返回的地址里包含我们
# 写入的 IP；不符则记日志并自动重建 + 重载。

# 用哪个受管域名做探针。留空 = 关闭该校验。
SELFCHECK_DOMAIN=github.com

# 两次自愈校验的最小间隔（秒）。防止每轮都发 DNS 查询。
SELFCHECK_INTERVAL=300

# 问哪台 DNS 做校验。默认本机 dnsmasq。
SELFCHECK_DNS=127.0.0.1

# ============ v2.4.2 新增：日志自动清理 ============
# 按天数自动删除过期日志行，避免日志无限增长（日志在内存盘，重启即失，
# 但长期开机时仍会累积）。0 = 关闭（仅按 MAX_LOG 行数滚动）。
AUTO_CLEAN_LOG_DAYS=3

# 清理检查的最小间隔（秒）。日志每次切换才写一行，没必要每行都扫一遍。
TRIM_INTERVAL=3600
